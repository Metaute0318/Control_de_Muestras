<title>Control de Muestras RT-037</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: centro de control en cristal (misma línea de Rendimientos AyC y Vale de Obra). Menú lateral flotante (barra inferior en celular), contenido en rejilla de 12 columnas, luz ambiente azul de marca y naranja de fachada. */
:root {
  --bg: #04070d;
  --surface: rgba(14, 22, 38, .66);
  --surface-solid: #0e1626;
  --surface-2: rgba(255, 255, 255, .045);
  --surface-3: rgba(255, 255, 255, .08);
  --ink: #edf2fa;
  --ink-2: #a8b5c8;
  --muted: #6f7d92;
  --line: rgba(140, 170, 220, .13);
  --line-2: rgba(140, 170, 220, .24);
  --brand: #1e4164;          /* azul Arquitectura & Concreto */
  --accent: #4d8dff;
  --accent-2: #8b6cff;
  --accent-ink: #04101f;
  --accent-soft: rgba(77, 141, 255, .15);
  --int: #3d8bff;
  --glow-int: rgba(61, 139, 255, .6);
  --glow-acc: rgba(77, 141, 255, .55);
  --good: #33d17a; --warn: #f5b83d; --crit: #ff5a5f;
  --good-bg: rgba(51, 209, 122, .13); --warn-bg: rgba(245, 184, 61, .13); --crit-bg: rgba(255, 90, 95, .13);
  --good-ink: #7ff0ad; --warn-ink: #ffd27a; --crit-ink: #ff9da0;
  --amb-1: rgba(37, 99, 235, .34); --amb-2: rgba(234, 108, 46, .26); --amb-3: rgba(30, 65, 100, .6);
  --shadow: 0 12px 40px rgba(0, 0, 0, .35);
  --tip-bg: #e9eef7; --tip-ink: #0b1424;
  --logo-blanco: block; --logo-azul: none;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 18px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not(.tema-oscuro) {
    --bg: #eef2f8; --surface: rgba(255, 255, 255, .74); --surface-solid: #ffffff; --surface-2: rgba(30, 65, 100, .05); --surface-3: rgba(30, 65, 100, .09);
    --ink: #0e1b2c; --ink-2: #3f4f66; --muted: #67768e; --line: rgba(30, 65, 100, .12); --line-2: rgba(30, 65, 100, .24);
    --accent: #1f5fd6; --accent-2: #6a4fe0; --accent-ink: #ffffff; --accent-soft: rgba(31, 95, 214, .11);
    --int: #2a78d6; --glow-int: rgba(42, 120, 214, .22); --glow-acc: rgba(31, 95, 214, .22);
    --good: #0ca30c; --warn: #d99a00; --crit: #d03b3b; --good-bg: #dcf2dc; --warn-bg: #fbefc9; --crit-bg: #f8dcda;
    --good-ink: #0d5a0d; --warn-ink: #6b4a00; --crit-ink: #8f1f1f;
    --amb-1: rgba(37, 99, 235, .13); --amb-2: rgba(234, 108, 46, .11); --amb-3: rgba(30, 65, 100, .10);
    --shadow: 0 8px 30px rgba(30, 65, 100, .10); --tip-bg: #0e1b2c; --tip-ink: #eef2f8;
    --logo-blanco: none; --logo-azul: block;
    color-scheme: light;
  }
}
:root[data-theme="light"]:not(.tema-oscuro), html:root.tema-claro {
  --bg: #eef2f8; --surface: rgba(255, 255, 255, .74); --surface-solid: #ffffff; --surface-2: rgba(30, 65, 100, .05); --surface-3: rgba(30, 65, 100, .09);
  --ink: #0e1b2c; --ink-2: #3f4f66; --muted: #67768e; --line: rgba(30, 65, 100, .12); --line-2: rgba(30, 65, 100, .24);
  --accent: #1f5fd6; --accent-2: #6a4fe0; --accent-ink: #ffffff; --accent-soft: rgba(31, 95, 214, .11);
  --int: #2a78d6; --glow-int: rgba(42, 120, 214, .22); --glow-acc: rgba(31, 95, 214, .22);
  --good: #0ca30c; --warn: #d99a00; --crit: #d03b3b; --good-bg: #dcf2dc; --warn-bg: #fbefc9; --crit-bg: #f8dcda;
  --good-ink: #0d5a0d; --warn-ink: #6b4a00; --crit-ink: #8f1f1f;
  --amb-1: rgba(37, 99, 235, .13); --amb-2: rgba(234, 108, 46, .11); --amb-3: rgba(30, 65, 100, .10);
  --shadow: 0 8px 30px rgba(30, 65, 100, .10); --tip-bg: #0e1b2c; --tip-ink: #eef2f8;
  --logo-blanco: none; --logo-azul: block;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 600px at 105% -10%, var(--amb-1), transparent 60%),
    radial-gradient(700px 520px at 100% 85%, var(--amb-2), transparent 62%),
    radial-gradient(800px 600px at -10% 10%, var(--amb-3), transparent 60%); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.logo-b { display: var(--logo-blanco); }
.logo-a { display: var(--logo-azul); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; font-weight: 400; }

/* Estructura */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); margin-block: 16px; display: flex; flex-direction: column; gap: 18px; padding: 20px 14px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05); }
.side .logo { padding: 2px 8px 6px; }
.side .logo img { width: 100%; max-width: 180px; height: auto; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; color: var(--ink-2); padding: 10px 12px; border-radius: 12px; cursor: pointer; font-weight: 500; text-align: left; white-space: nowrap; }
.nav button svg { width: 20px; height: 20px; flex: none; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent); }
.nav button[aria-current="page"] svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--glow-acc)); }
.nav .badge { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: grid; gap: 8px; }
.theme-btn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-weight: 500; }
.theme-btn svg { width: 18px; height: 18px; }
.theme-btn:hover { color: var(--ink); border-color: var(--line-2); }
.side-obra { font-size: 12px; color: var(--muted); padding: 0 6px; line-height: 1.35; display: grid; gap: 2px; }
.side-obra b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }

.content { min-width: 0; padding-block: 18px 48px; }
.topbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.topbar .t-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
.topbar .t-logo { display: none; height: 40px; width: auto; }
.topbar h1 { margin: 2px 0 0; font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: -.01em; line-height: 1.1; text-wrap: balance; }
.topbar .t-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill-glass { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px; color: var(--ink-2); }
.pill-glass input { width: 54px; border: 0; background: transparent; font-weight: 600; color: var(--ink); text-align: right; padding: 0; font-variant-numeric: tabular-nums; }
.pill-glass input:focus { outline: none; }
.pill-glass:focus-within { border-color: var(--accent); }
.pill-glass .live { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.pill-glass .live.off { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
.topbar .theme-btn { display: none; padding: 7px 10px; }

/* Tarjetas */
.stack { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .04); position: relative; }
.card h2, .card h3 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -.005em; text-wrap: balance; }
.card h2 { font-size: 19px; }
.card h3 { font-size: 15px; }
.card h2 small, .card h3 small { font-family: var(--font-body); font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
.card-hd { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.card-hd p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; } .s12 { grid-column: span 12; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: var(--shadow); }
.kpi .v { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.05; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.kpi .d { font-size: 12px; color: var(--muted); }
.split-bar { display: flex; gap: 2px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--surface-3); margin-top: 4px; }
.split-bar span { height: 100%; }
.sb-good { background: var(--good); box-shadow: 0 0 10px color-mix(in srgb, var(--good) 55%, transparent); }
.sb-crit { background: var(--crit); box-shadow: 0 0 10px color-mix(in srgb, var(--crit) 55%, transparent); }
.sb-wait { background: var(--line-2); }

/* Controles */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 500; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 6px 22px var(--glow-acc); }
.btn.primary:disabled { box-shadow: none; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.btn svg { width: 16px; height: 16px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button small { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-left: 3px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; box-shadow: 0 0 14px var(--glow-acc); }
.seg button[aria-pressed="true"] small { color: inherit; opacity: .8; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.filters .spacer { flex: 1 1 auto; }
.search { flex: 1 1 200px; max-width: 320px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; min-width: 0; }
.search:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input::placeholder, textarea::placeholder { color: var(--muted); }

/* Carga */
.drop { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 30px 16px; border: 1.5px dashed var(--line-2); border-radius: 14px; background: var(--surface-2); cursor: pointer; color: var(--ink-2); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop b { font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--ink); }
.drop svg { width: 28px; height: 28px; color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.rules > div { display: grid; gap: 3px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.rules b { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.sumrow { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.pill.big { font-size: 12.5px; padding: 4px 11px; }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-bg); color: var(--good-ink); }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.crit { background: var(--crit-bg); color: var(--crit-ink); }
.rlist { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ritem { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 14px; padding: 12px 14px; border-top: 1px solid var(--line); }
.ritem:first-child { border-top: 0; }
.ritem .tag { padding-top: 2px; }
.ritem h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; margin: 0; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.ritem h3 small { font-family: var(--font-body); font-weight: 400; font-size: 12.5px; color: var(--muted); }
.changes { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 4px; }
.changes span { white-space: nowrap; }
.changes .lbl { color: var(--muted); font-size: 12px; margin-right: 4px; }
.alerts { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12.5px; color: var(--warn-ink); }
.alerts li { display: flex; gap: 6px; align-items: baseline; }
.alerts svg { width: 12px; height: 12px; flex: none; transform: translateY(1px); }
.diffrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 12.5px; color: var(--crit-ink); margin-top: 6px; }
.diffrow label { display: inline-flex; gap: 6px; align-items: center; color: var(--ink); cursor: pointer; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); gap: 12px; }
.fgrid .wide { grid-column: 1 / -1; }
label.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.inp { font-family: var(--font-body); font-size: 14px; letter-spacing: 0; text-transform: none; width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; min-width: 0; color: var(--ink); }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.inp.bad { border-color: var(--crit); }
.ptable { margin-top: 14px; }
.ptable table { min-width: 520px; }
.ptable td { padding: 6px 8px; }
.ptable td:first-child { width: 44px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ptable .inp { padding: 6px 9px; }
.ptable td.n .inp { text-align: right; }
.mprev { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.mprev b { font-family: var(--font-display); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 8px; font-size: 13px; }
.icon-btn:hover { color: var(--crit); background: var(--surface-3); }
.icon-btn:disabled { opacity: .35; cursor: not-allowed; background: none; }
.note { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 13px; border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.err { padding: 12px 14px; border-radius: 12px; background: var(--crit-bg); color: var(--crit-ink); border: 1px solid color-mix(in srgb, var(--crit) 40%, transparent); margin: 0; }

/* Tablas */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
.planilla table { min-width: 1000px; }
th { text-align: left; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface-solid); padding: 9px 10px; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
th.n, td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.m { font-family: var(--font-display); font-weight: 600; font-size: 14px; white-space: nowrap; }
td.loc { max-width: 280px; }
td.empty-v { color: var(--muted); }
td.below { color: var(--crit-ink); font-weight: 600; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--surface-2); }
tr.row.open td { background: var(--accent-soft); }
tr.detail > td { background: var(--surface-2); padding: 14px 16px 18px; }
.edad-tag { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: var(--warn-bg); color: var(--warn-ink); vertical-align: 1px; }
.p .edad-tag { margin-left: 4px; }
.flag { color: var(--warn-ink); margin-left: 4px; display: inline-flex; vertical-align: -1px; }
.flag svg { width: 12px; height: 12px; }
.det { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 18px; }
.probetas { display: grid; gap: 10px; margin-top: 6px; }
.probetas .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.probetas .grp > b { font-family: var(--font-display); font-weight: 600; min-width: 46px; }
.probetas .p { font-variant-numeric: tabular-nums; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 2px 8px; }
.probetas .nt { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; margin: 6px 0 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.det textarea { width: 100%; min-height: 76px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; resize: vertical; margin-top: 6px; }
.det textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.det .actions { margin-top: 8px; }

/* Listas */
.list { display: grid; }
.list-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.list-row:first-child { border-top: 0; }
.list-row .ck { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ck.crit { border: 2px solid var(--crit); color: var(--crit-ink); }
.ck.good { background: var(--good); color: #04130a; box-shadow: 0 0 10px color-mix(in srgb, var(--good) 60%, transparent); }
.list-row .nm { min-width: 0; }
.list-row .nm b { font-family: var(--font-display); font-weight: 600; }
.list-row .nm span { display: block; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const LS_KEY = "rt037-control-v1";
  const AGES = [["r7", "7 d"], ["r28", "28 d"], ["r56", "56 d"]];
  const ls = { get(k) { try { return localStorage.getItem("rt037." + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem("rt037." + k, v); } catch (e) { /* sin almacenamiento */ } } };

  const state = {
    muestras: new Map(), obra: { obra: "", fc: 125, codigo: "" }, historial: [],
    mode: "loading", canWrite: true, plan: null, abierto: null, confirmDel: null,
    tab: ["inicio", "cargar", "planilla", "historial"].includes(ls.get("tab")) ? ls.get("tab") : "inicio",
    filtro: { serie: "todas", estado: "todos", q: "" },
  };
  let db = null, downloads = null;

  // ---------- utilidades ----------
  const norm = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[´`’‘]/g, "'").toLowerCase().replace(/\s+/g, " ").trim();
  const round2 = (x) => Math.round(x * 100) / 100;
  const avg = (a) => a.length ? round2(a.reduce((s, x) => s + x, 0) / a.length) : null;
  const fmt = (v) => v == null || v === "" ? "—" : Number(v).toLocaleString("es-CO", { maximumFractionDigits: 2 });
  const num = (v) => {
    if (v == null || v === "") return null;
    if (typeof v === "number") return isFinite(v) ? v : null;
    const s = String(v).trim().replace(/\s/g, "");
    if (!s) return null;
    const t = /,\d{1,3}$/.test(s) && !/\.\d/.test(s) ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    const n = Number(t);
    return isFinite(n) ? n : null;
  };
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  function isoDate(v) {
    if (v == null || v === "") return null;
    if (v instanceof Date && !isNaN(v)) return ymd(new Date(v.getTime() + 12 * 3600e3));
    if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
    const s = String(v).trim();
    let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
    if (m) {
      const a = +m[1], b = +m[2]; let y = +m[3]; if (y < 100) y += 2000;
      // El laboratorio exporta M/D/AAAA; si el primer número pasa de 12 es D/M/AAAA.
      const [mo, da] = a > 12 ? [b, a] : [a, b];
      return `${y}-${pad(mo)}-${pad(da)}`;
    }
    return null;
  }
  const dmy = (iso) => iso ? iso.split("-").reverse().join("/") : "—";
  const muestraId = (s) => String(s ?? "").toUpperCase().replace(/\s+/g, "").trim();
  const docId = (m, f) => `${m.replace(/[^A-Za-z0-9_-]/g, "-")}__${f}`;
  const fcDe = (codigo) => { const m = String(codigo ?? "").match(/(\d+(?:[.,]\d+)?)/); return m ? Number(m[1].replace(",", ".")) : null; };
  // R7d: 1 a 27 días · R28d: 28 a 55 días · R56d: 56 días o más. Las edades distintas de 7, 28 y 56 se señalan.
  const bucket = (edad) => edad < 28 ? "r7" : edad < 56 ? "r28" : "r56";
  const EDAD_STD = { r7: 7, r28: 28, r56: 56 };
  const LBL = { r7: "R7d", r28: "R28d", r56: "R56d" };
  // Edades de falla distintas a la nominal, por grupo: { r7: [8], r28: [27] }
  function edadesRaras(ensayos) {
    const out = {};
    for (const e of ensayos || []) { const b = bucket(e[0]); if (e[0] !== EDAD_STD[b]) (out[b] = out[b] || []).includes(e[0]) || out[b].push(e[0]); }
    for (const b in out) out[b].sort((x, y) => x - y);
    return out;
  }
  const diasTxt = (arr) => arr.join(", ") + (arr.length === 1 && arr[0] === 1 ? " día" : " días");
  const edadTag = (arr) => arr && arr.length ? `<span class="edad-tag" title="Fallada a ${diasTxt(arr)}">${arr.join("/")} d</span>` : "";
  const serieDe = (m) => (String(m).match(/^[A-Z]+/) || ["?"])[0];
  const natCmp = (a, b) => a.localeCompare(b, "es", { numeric: true });
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const hoy = () => dmy(ymd(new Date()));
  const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
  const addDays = (iso, n) => { const [y, m, d] = iso.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); };
  const MANUAL = "Registro manual";
  const probetaVacia = (edad = "7") => ({ edad, res: "", fr: "" });
  const nuevoManual = (base = {}) => ({ muestra: "", fecha: base.fecha || ymd(new Date()), codigo: base.codigo || `${state.obra.fc} kg/CM2`, localizacion: "", remision: base.remision || "", probetas: [probetaVacia(), probetaVacia(), probetaVacia()], error: "", bad: [] });
  state.manual = nuevoManual();

  function fcMuestra(m) { return fcDe(m.codigo) ?? state.obra.fc; }
  function estado(m) {
    const thr = fcMuestra(m) * 0.85;
    const vals = [m.r7, m.r28, m.r56];
    if (vals.every((v) => v == null)) return "wait";
    if (vals.some((v) => v != null && v > thr)) return "ok";
    return m.r28 != null ? "no" : "wait";
  }
  const ESTADO = { ok: ["good", "✓ Cumple"], no: ["crit", "✕ No cumple"], wait: ["", "◷ Pendiente"] };

  // ---------- íconos, pestañas y tema ----------
  const svgI = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    inicio: svgI('<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    cargar: svgI('<path d="M12 15V4m0 0 4 4m-4-4L8 8"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'),
    planilla: svgI('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9.7h18M3 14.3h18M9 5v4.7M15 9.7v4.6M9 14.3V19"/>'),
    historial: svgI('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    sun: svgI('<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'),
    moon: svgI('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
    dl: svgI('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
    warn: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 14H1L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6v3.6M8 11.6v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  };
  const TABS = [["inicio", "Inicio"], ["cargar", "Cargar resultados", "Cargar"], ["planilla", "Planilla de control", "Planilla"], ["historial", "Historial"]];
  const TITLES = { inicio: "Panel de resistencias", cargar: "Cargar resultados del laboratorio", planilla: "Planilla de control", historial: "Historial de cargas" };

  function temaActual() {
    const c = document.documentElement.classList;
    if (c.contains("tema-claro")) return "claro";
    if (c.contains("tema-oscuro")) return "oscuro";
    return getComputedStyle(document.documentElement).colorScheme.includes("light") ? "claro" : "oscuro";
  }
  function pintarTemaBtn() {
    const t = temaActual();
    document.querySelectorAll("[data-act-theme]").forEach((b) => {
      b.innerHTML = t === "oscuro" ? ICON.sun + "<span>Modo claro</span>" : ICON.moon + "<span>Modo oscuro</span>";
      b.setAttribute("aria-label", t === "oscuro" ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
    });
  }
  function aplicarTema(t) {
    const c = document.documentElement.classList; c.remove("tema-claro", "tema-oscuro");
    if (t) c.add("tema-" + t);
    ls.set("tema", t || ""); pintarTemaBtn();
    if (state.tab === "inicio") renderMain();
  }

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 4200); }
  const tip = $("#tip");
  function showTip(html, e) {
    tip.innerHTML = html; tip.hidden = false;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY - h - 10;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y < 8) y = e.clientY + 16;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = y + "px";
  }
  const hideTip = () => { tip.hidden = true; };

  // ---------- almacenamiento ----------
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY); if (!raw) return;
      const d = JSON.parse(raw);
      state.muestras = new Map(Object.entries(d.muestras || {}));
      if (d.obra) state.obra = { ...state.obra, ...d.obra };
      state.historial = d.historial || [];
    } catch (e) { /* sin almacenamiento */ }
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ muestras: Object.fromEntries(state.muestras), obra: state.obra, historial: state.historial })); } catch (e) { /* sin almacenamiento */ }
  }
  async function putMuestra(id, data) {
    state.muestras.set(id, data);
    if (db) await db.collection("muestras").doc(id).set(data); else saveLocal();
  }
  async function delMuestra(id) {
    state.muestras.delete(id);
    if (db) await db.collection("muestras").doc(id).delete(); else saveLocal();
  }
  async function putObra() {
    if (db) await db.doc("config/obra").set({ ...state.obra }); else saveLocal();
  }
  async function addHist(h) {
    state.historial.unshift(h);
    if (db) await db.collection("historial").doc(h.id).set(h); else { state.historial = state.historial.slice(0, 50); saveLocal(); }
  }

  async function init() {
    renderNav(); renderAll();
    const c = window.claude && typeof window.claude.use === "function" ? window.claude : null;
    if (c) {
      try { db = await c.use("db"); } catch (e) { db = null; }
      try { downloads = await c.use("downloads"); } catch (e) { downloads = null; }
      try {
        const user = await c.use("user");
        const w = user ? await user.can("data.write") : null;
        if (w === false) state.canWrite = false;
      } catch (e) { /* sin datos de usuario */ }
    }
    if (db) {
      state.mode = "db";
      db.collection("muestras").onSnapshot((snap) => {
        state.muestras = new Map(snap.docs.map((d) => [d.id, d.data()]));
        renderAll();
      }, () => { state.mode = "error"; renderChrome(); });
      db.doc("config/obra").onSnapshot((snap) => {
        if (snap.exists) { state.obra = { ...state.obra, ...snap.data() }; renderAll(); }
      });
      db.collection("historial").orderBy("ts", "desc").limit(30).onSnapshot((snap) => {
        state.historial = snap.docs.map((d) => d.data()); if (state.tab === "historial") renderMain();
      });
    } else {
      state.mode = "local"; loadLocal();
    }
    renderAll();
  }

  // ---------- lectura de archivos ----------
  function findHeader(rows, test, maxRow = 60) {
    for (let r = 0; r < Math.min(rows.length, maxRow); r++) {
      const cells = (rows[r] || []).map(norm);
      if (test(cells)) return { r, cells };
    }
    return null;
  }
  const colOf = (cells, ...preds) => { for (const p of preds) { const i = cells.findIndex(p); if (i >= 0) return i; } return -1; };

  function parseResultados(rows) {
    const h = findHeader(rows, (c) => c.includes("edad") && c.some((x) => x.includes("resistencia") && x.includes("kg")));
    if (!h) return null;
    const c = h.cells;
    const ix = {
      m: colOf(c, (x) => x === "label", (x) => x.startsWith("muestra"), (x) => x.startsWith("n")),
      loc: colOf(c, (x) => x.startsWith("localizacion")),
      rem: colOf(c, (x) => x.startsWith("remision")),
      fm: colOf(c, (x) => x === "fechamuestreo", (x) => x.includes("muestreo")),
      fr: colOf(c, (x) => x === "fecharotura", (x) => x.includes("rotura")),
      cod: colOf(c, (x) => x === "codigomezcla", (x) => x.includes("mezcla")),
      obra: colOf(c, (x) => x === "codigoobra", (x) => x.includes("obra")),
      edad: colOf(c, (x) => x === "edad"),
      res: colOf(c, (x) => x.includes("resistencia") && x.includes("kg")),
    };
    if (ix.m < 0 || ix.fm < 0) return null;
    const grupos = new Map(); let filas = 0, codigoObra = "";
    for (let r = h.r + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const m = muestraId(row[ix.m]); const f = isoDate(row[ix.fm]);
      const edad = num(row[ix.edad]); const res = num(row[ix.res]);
      if (!m || !f || edad == null || res == null) continue;
      filas++;
      if (!codigoObra && ix.obra >= 0 && row[ix.obra]) codigoObra = String(row[ix.obra]).trim();
      const k = docId(m, f);
      if (!grupos.has(k)) grupos.set(k, { muestra: m, fecha: f, locs: new Set(), rems: new Set(), cods: new Set(), ensayos: [] });
      const g = grupos.get(k);
      if (ix.loc >= 0 && row[ix.loc]) g.locs.add(String(row[ix.loc]).trim());
      if (ix.rem >= 0 && row[ix.rem]) g.rems.add(String(row[ix.rem]).trim());
      if (ix.cod >= 0 && row[ix.cod]) g.cods.add(String(row[ix.cod]).trim());
      g.ensayos.push([edad, res, ix.fr >= 0 ? isoDate(row[ix.fr]) : null]);
    }
    return { recs: recsDeGrupos(grupos), filas, codigoObra };
  }
  function recsDeGrupos(grupos) {
    const recs = new Map();
    for (const [k, g] of grupos) {
      const rec = { muestra: g.muestra, fecha: g.fecha, codigo: [...g.cods][0] || "", localizacion: [...g.locs][0] || "", remision: [...g.rems][0] || "", ensayos: g.ensayos, alertas: [] };
      for (const [b] of AGES) {
        const vals = g.ensayos.filter((e) => bucket(e[0]) === b).map((e) => e[1]);
        rec[b] = avg(vals); rec["n" + b.slice(1)] = vals.length || null;
      }
      if (g.locs.size > 1) rec.alertas.push(`Localización distinta entre probetas: ${[...g.locs].join(" / ")}`);
      if (g.cods.size > 1) rec.alertas.push(`Código de mezcla distinto entre probetas: ${[...g.cods].join(" / ")}`);
      recs.set(k, rec);
    }
    return recs;
  }

  // ---------- informes PDF de SGS ----------
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  const loadScript = (src) => new Promise((ok, fail) => { const sc = document.createElement("script"); sc.src = src; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
  let pdfjsListo = null;
  function cargarPdfjs() {
    // El lector se carga solo cuando llega un PDF. Con pdf.worker cargado como script, pdf.js trabaja en la misma página (sin worker aparte).
    if (!pdfjsListo) pdfjsListo = loadScript(PDFJS + "pdf.min.js").then(() => loadScript(PDFJS + "pdf.worker.min.js")).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; });
    pdfjsListo.catch(() => { pdfjsListo = null; });
    return pdfjsListo;
  }
  async function lineasPdf(buf) {
    await cargarPdfjs();
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
    const lines = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const tc = await (await pdf.getPage(i)).getTextContent();
      const rows = [];
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) continue;
        const x = it.transform[4], y = it.transform[5];
        let r = rows.find((q) => Math.abs(q.y - y) < 3);
        if (!r) { r = { y, items: [] }; rows.push(r); }
        r.items.push({ x, w: it.width || 0, s: it.str });
      }
      rows.sort((a, b) => b.y - a.y);
      for (const r of rows) {
        r.items.sort((a, b) => a.x - b.x);
        const cells = []; let last = null;
        for (const it of r.items) {
          const gap = last ? it.x - (last.x + last.w) : Infinity;
          if (gap < 6) { last.s += (gap > 1 ? " " : "") + it.s; last.w = it.x + it.w - last.x; }
          else { last = { ...it }; cells.push(last); }
        }
        lines.push(cells.map((c) => c.s.trim()).join("  "));
      }
    }
    return lines;
  }
  function parseInformeSgs(lines) {
    const pnum = (t) => { const x = String(t).trim().replace(/\.$/, "").replace(/,/g, ""); const n = Number(x); return x && isFinite(n) ? n : null; };
    const valor = (t) => t.trim().replace(/\.$/, "").trim();
    const grupos = new Map(); let cur = null, edades = null, informe = "", obra = "", filas = 0;
    const campos = [
      ["muestra", /^Identificaci[oó]n de Muestra\s*:\.?\s*(.+)$/i], ["loc", /^Localizaci[oó]n\s*:\.?\s*(.+)$/i],
      ["fecha", /^Fecha de Fundida\s*:\.?\s*(.+)$/i], ["edad", /^Edad \(d[ií]as\)\s*:\.?\s*(.+)$/i],
      ["codigo", /^C[oó]digo de Mezcla\s*:\.?\s*(.+)$/i], ["rem", /^N[uú]mero de Remisi[oó]n\s*:\.?\s*(.+)$/i],
      ["fr", /^Fecha de Rotura\s*:\.?\s*(.+)$/i],
    ];
    for (const raw of lines) {
      const t = raw.replace(/\*+/g, "").replace(/\s+/g, " ").trim();
      let m;
      if (!informe && (m = t.match(/No\.\s*(ME\d+)/))) informe = m[1];
      if (!obra && (m = t.match(/Obra:\s*(.+)$/))) obra = valor(m[1]);
      for (const [k, re] of campos) {
        if (!(m = t.match(re))) continue;
        if (k === "muestra") { cur = { muestra: muestraId(valor(m[1])) }; edades = null; }
        else if (cur) cur[k] = valor(m[1]);
      }
      if (/^Edad de Ensayo\b/i.test(t)) edades = t.replace(/^Edad de Ensayo\s*(D[ií]a\(s\)\.?)?/i, "").split(" ").map(pnum).filter((x) => x != null);
      if (cur && /^Resistencia a la Compresi[oó]n kgf\s*\/\s*cm/i.test(t)) {
        const vals = t.replace(/^Resistencia a la Compresi[oó]n kgf\s*\/\s*cm²?\.?/i, "").split(" ").map(pnum).filter((x) => x != null);
        const fecha = isoDate(cur.fecha);
        if (!cur.muestra || !fecha) continue;
        const k = docId(cur.muestra, fecha);
        if (!grupos.has(k)) grupos.set(k, { muestra: cur.muestra, fecha, locs: new Set(), rems: new Set(), cods: new Set(), ensayos: [] });
        const g = grupos.get(k);
        if (cur.loc) g.locs.add(cur.loc); if (cur.rem) g.rems.add(cur.rem); if (cur.codigo) g.cods.add(cur.codigo);
        vals.forEach((v, i) => { const e = edades && edades[i] != null ? edades[i] : num(cur.edad); if (e != null) { g.ensayos.push([e, v, isoDate(cur.fr)]); filas++; } });
      }
    }
    return { recs: recsDeGrupos(grupos), filas, informe, obra };
  }

  function parseControl(rows) {
    const h = findHeader(rows, (c) => c.some((x) => x.startsWith("muestra n")) && c.some((x) => x.includes("fecha de fundida")), 200);
    if (!h) return null;
    const c = h.cells;
    const ix = {
      m: colOf(c, (x) => x.startsWith("muestra n")), cod: colOf(c, (x) => x.includes("mezcla")),
      loc: colOf(c, (x) => x.startsWith("localizacion")), rem: colOf(c, (x) => x.startsWith("remision")),
      f: colOf(c, (x) => x.includes("fecha de fundida")),
      r7: colOf(c, (x) => /^r ?7 ?d/.test(x)), r28: colOf(c, (x) => /^r ?28 ?d/.test(x)), r56: colOf(c, (x) => /^r ?56 ?d/.test(x)),
      obs: colOf(c, (x) => x.startsWith("observaciones")),
    };
    const recs = new Map(); let filas = 0;
    for (let r = h.r + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const m = muestraId(row[ix.m]); const f = isoDate(row[ix.f]);
      if (!m || !f) continue;
      filas++;
      const rec = {
        muestra: m, fecha: f, codigo: ix.cod >= 0 && row[ix.cod] ? String(row[ix.cod]).trim() : "",
        localizacion: ix.loc >= 0 && row[ix.loc] ? String(row[ix.loc]).trim() : "",
        remision: ix.rem >= 0 && row[ix.rem] ? String(row[ix.rem]).trim() : "",
        r7: ix.r7 >= 0 ? num(row[ix.r7]) : null, r28: ix.r28 >= 0 ? num(row[ix.r28]) : null, r56: ix.r56 >= 0 ? num(row[ix.r56]) : null,
        obs: ix.obs >= 0 && row[ix.obs] ? String(row[ix.obs]).trim() : "", ensayos: [], alertas: [],
      };
      for (const b of ["r7", "r28", "r56"]) if (rec[b] != null) rec[b] = round2(rec[b]);
      recs.set(docId(m, f), rec);
    }
    // Datos de la obra en el encabezado del formato
    let obra = "", fc = null;
    for (let r = 0; r < h.r; r++) {
      const row = rows[r] || [];
      row.forEach((v, i) => {
        const n = norm(v);
        if (n.startsWith("obra")) { const nx = row.slice(i + 1).find((x) => x != null && String(x).trim()); if (nx && !obra) obra = String(nx).trim(); }
        if (/^f'c ?=/.test(n)) { const nx = row.slice(i + 1).map(num).find((x) => x != null); if (nx && !fc) fc = nx; }
      });
    }
    return { recs, filas, obra, fc };
  }

  function sameEnsayo(a, b) { return a[0] === b[0] && a[1] === b[1] && (a[2] || "") === (b[2] || ""); }
  function mergeEnsayos(a = [], b = []) { const out = a.slice(); for (const e of b) if (!out.some((x) => sameEnsayo(x, e))) out.push(e); return out; }

  function combine(into, rec) {
    const k = docId(rec.muestra, rec.fecha);
    const cur = into.get(k);
    if (!cur) { into.set(k, rec); return; }
    for (const f of ["codigo", "localizacion", "remision", "obs", "r7", "r28", "r56", "n7", "n28", "n56"]) if ((cur[f] == null || cur[f] === "") && rec[f] != null && rec[f] !== "") cur[f] = rec[f];
    cur.ensayos = mergeEnsayos(cur.ensayos, rec.ensayos);
    cur.alertas = [...new Set([...(cur.alertas || []), ...(rec.alertas || [])])];
  }

  async function readFile(file) {
    const buf = await file.arrayBuffer();
    if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") {
      const lines = await lineasPdf(buf);
      if (!lines.some((l) => l.trim())) throw { code: "pdf_sin_texto" };
      const r = parseInformeSgs(lines);
      return { incoming: r.recs, fuentes: r.filas ? [`Informe SGS ${r.informe || file.name}: ${plural(r.filas, "probeta", "probetas")}`] : [], obraInfo: r.obra ? { codigo: r.obra } : {}, archivo: file.name, filas: r.filas };
    }
    const isCsv = /\.csv$/i.test(file.name);
    const wb = isCsv ? XLSX.read(new TextDecoder().decode(buf), { type: "string", raw: true }) : XLSX.read(buf, { type: "array", cellDates: true });
    const incoming = new Map(); const fuentes = []; const obraInfo = {};
    const controls = [], results = [];
    for (const name of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: true });
      const ctl = parseControl(rows); if (ctl && ctl.filas) { controls.push(ctl); fuentes.push(`${name}: ${ctl.filas} filas de control`); continue; }
      const res = parseResultados(rows); if (res && res.filas) { results.push(res); fuentes.push(`${name}: ${res.filas} ensayos`); }
    }
    for (const c of controls) { for (const r of c.recs.values()) combine(incoming, r); if (c.obra) obraInfo.obra = c.obra; if (c.fc) obraInfo.fc = c.fc; }
    for (const r of results) { for (const x of r.recs.values()) combine(incoming, x); if (r.codigoObra) obraInfo.codigo = r.codigoObra; }
    return { incoming, fuentes, obraInfo, archivo: file.name, filas: results.reduce((s, r) => s + r.filas, 0) };
  }

  // ---------- plan de actualización ----------
  function planImport(parsed) {
    const items = [];
    const porNumero = new Map();
    for (const m of state.muestras.values()) { if (!porNumero.has(m.muestra)) porNumero.set(m.muestra, []); porNumero.get(m.muestra).push(m.fecha); }
    for (const [k, rec] of parsed.incoming) {
      const cur = state.muestras.get(k);
      const alertas = [...(rec.alertas || [])];
      const fc = fcDe(rec.codigo || cur?.codigo);
      if (fc != null && fc !== state.obra.fc) alertas.push(`f'c de la mezcla (${fc} kg/cm²) distinto al f'c de la obra (${state.obra.fc}). Se evalúa con ${fc}.`);
      for (const [b, lbl] of AGES) { const n = rec["n" + b.slice(1)]; if (n === 1) alertas.push(`Solo 1 probeta a ${lbl}.`); }
      const raras = edadesRaras(rec.ensayos);
      for (const b in raras) alertas.push(`${LBL[b]} fallado a ${diasTxt(raras[b])}, no a ${EDAD_STD[b]}.`);
      if (!cur) {
        const otras = (porNumero.get(rec.muestra) || []).filter((f) => f !== rec.fecha);
        if (otras.length) alertas.push(`Ya existe ${rec.muestra} con otra fecha (${otras.map(dmy).join(", ")}). Revisa si es la misma muestra.`);
        items.push({ k, tipo: "nueva", rec, cambios: AGES.filter(([b]) => rec[b] != null).map(([b]) => ({ b, antes: null, despues: rec[b] })), difs: [], alertas });
        continue;
      }
      const cambios = [], difs = [];
      for (const [b] of AGES) {
        if (rec[b] == null) continue;
        if (cur[b] == null) cambios.push({ b, antes: null, despues: rec[b] });
        else if (Math.abs(cur[b] - rec[b]) > 0.011) difs.push({ b, antes: cur[b], despues: rec[b], reemplazar: false });
      }
      const tipo = cambios.length ? "actualiza" : difs.length ? "difiere" : "igual";
      items.push({ k, tipo, rec, cambios, difs, alertas: tipo === "igual" ? [] : alertas });
    }
    const orden = { nueva: 0, actualiza: 1, difiere: 2, igual: 3 };
    items.sort((a, b) => orden[a.tipo] - orden[b.tipo] || a.rec.fecha.localeCompare(b.rec.fecha) || natCmp(a.rec.muestra, b.rec.muestra));
    return { ...parsed, items };
  }

  function traza(n, rec, archivo, b) {
    const partes = [n ? `Promedio de ${plural(n, "probeta", "probetas")}` : "Valor tomado del formato"];
    const raras = b ? edadesRaras(rec.ensayos)[b] : null;
    if (raras) partes.push(`Fallado a ${diasTxt(raras)}`);
    if (rec.remision) partes.push(`Remisión: ${rec.remision}`);
    partes.push(`Muestreo: ${dmy(rec.fecha)}`, archivo === MANUAL ? `Registrado manualmente el ${hoy()}` : `Cargado desde ${archivo} el ${hoy()}`);
    return partes.join(" — ");
  }

  async function applyPlan(btn) {
    const p = state.plan; if (!p) return;
    if (btn) { btn.disabled = true; btn.textContent = "Guardando…"; }
    const now = new Date().toISOString();
    const nuevas = [], actualizadas = [];
    try {
      if (p.obraInfo.obra && !state.obra.obra) state.obra.obra = p.obraInfo.obra;
      if (p.obraInfo.codigo && !state.obra.codigo) state.obra.codigo = p.obraInfo.codigo;
      if (p.obraInfo.obra || p.obraInfo.codigo) await putObra();
      for (const it of p.items) {
        const rec = it.rec;
        if (it.tipo === "nueva") {
          const d = { muestra: rec.muestra, fecha: rec.fecha, codigo: rec.codigo || "", localizacion: rec.localizacion || "", remision: rec.remision || "", obs: rec.obs || "", ensayos: rec.ensayos || [], notas: {}, creado: now, actualizado: now };
          for (const [b] of AGES) { const nk = "n" + b.slice(1); d[b] = rec[b] ?? null; d[nk] = rec[nk] ?? null; if (rec[b] != null) d.notas[b] = traza(rec[nk], rec, p.archivo, b); }
          await putMuestra(it.k, d); nuevas.push(rec.muestra); continue;
        }
        const cur = state.muestras.get(it.k); if (!cur) continue;
        const d = JSON.parse(JSON.stringify(cur)); d.notas = d.notas || {};
        let changed = false;
        const aplicar = [...it.cambios, ...it.difs.filter((x) => x.reemplazar)];
        for (const c of aplicar) { const nk = "n" + c.b.slice(1); d[c.b] = c.despues; d[nk] = rec[nk] ?? null; d.notas[c.b] = traza(rec[nk], rec, p.archivo, c.b) + (c.antes != null ? ` (antes ${fmt(c.antes)})` : ""); changed = true; }
        for (const f of ["codigo", "localizacion", "remision"]) if (!d[f] && rec[f]) { d[f] = rec[f]; changed = true; }
        const ens = mergeEnsayos(d.ensayos, rec.ensayos); if (ens.length !== (d.ensayos || []).length) { d.ensayos = ens; changed = true; }
        if (!changed) continue;
        d.actualizado = now; await putMuestra(it.k, d);
        if (aplicar.length) actualizadas.push(rec.muestra);
      }
      await addHist({ id: "h" + Date.now(), ts: now, archivo: p.archivo, filas: p.filas, nuevas, actualizadas, sinCambios: p.items.filter((i) => i.tipo === "igual").length });
      if (p.manual) state.manual = nuevoManual(state.manual);
      state.plan = null; renderAll();
      toast(nuevas.length || actualizadas.length ? `Cambios aplicados: ${plural(nuevas.length, "muestra nueva", "muestras nuevas")} y ${plural(actualizadas.length, "actualizada", "actualizadas")}.` : "Cambios aplicados: no había resultados nuevos.");
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = "Aplicar cambios"; }
      toast(e && e.code === "quota_exceeded" ? "El registro llegó a su límite de tamaño. Descarga el Excel y elimina muestras antiguas."
        : e && e.code === "invalid_argument" ? "No tienes permiso para modificar este registro. Pide acceso de colaborador al propietario."
        : "No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.");
      renderAll();
    }
  }

  // ---------- render: marco ----------
  function renderNav() {
    $("#nav").innerHTML = TABS.map(([k, l, c]) => `<button type="button" data-tab="${k}" title="${l}">${ICON[k]}<span>${c || l}</span>${k === "cargar" ? '<b class="badge" id="navBadge" hidden></b>' : ""}</button>`).join("");
  }
  function renderChrome() {
    document.querySelectorAll("[data-tab]").forEach((b) => { if (b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    const badge = $("#navBadge");
    if (badge) { const n = state.plan && state.plan.items ? state.plan.items.filter((i) => i.tipo !== "igual").length : 0; badge.hidden = !n; badge.textContent = n; }
    $("#hTitle").textContent = TITLES[state.tab];
    const inp = $("#fcInput");
    if (document.activeElement !== inp) inp.value = state.obra.fc;
    inp.disabled = !state.canWrite;
    const modo = state.mode === "db" ? (state.canWrite ? "Registro compartido en línea" : "Solo lectura")
      : state.mode === "local" ? "Modo local: solo este navegador"
      : state.mode === "error" ? "Sin conexión con el registro" : "Conectando…";
    $("#liveDot").classList.toggle("off", state.mode !== "db");
    $("#sideObra").innerHTML = `<b>${esc(state.obra.obra || "Obra sin nombre")}</b><span>${esc(state.obra.codigo || "")}</span><span>${esc(modo)}</span>`;
  }

  function filtradas() {
    const { serie, estado: est, q } = state.filtro; const nq = norm(q);
    return [...state.muestras.entries()].map(([id, m]) => ({ id, ...m, _e: estado(m) }))
      .filter((m) => (serie === "todas" || serieDe(m.muestra) === serie) && (est === "todos" || (est === "edad" ? Object.keys(edadesRaras(m.ensayos)).length > 0 : m._e === est)) && (!nq || norm(m.muestra + " " + m.localizacion + " " + (m.remision || "")).includes(nq)))
      .sort((a, b) => b.fecha.localeCompare(a.fecha) || natCmp(b.muestra, a.muestra));
  }
  function segSerie() {
    const series = [...new Set([...state.muestras.values()].map((m) => serieDe(m.muestra)))].sort();
    const all = [...state.muestras.values()];
    const opts = [["todas", "Todas", all.length], ...series.map((s) => [s, `Serie ${s}`, all.filter((m) => serieDe(m.muestra) === s).length])];
    return `<div class="seg" role="group" aria-label="Serie">${opts.map(([v, l, n]) => `<button type="button" data-serie="${esc(v)}" aria-pressed="${state.filtro.serie === v}">${esc(l)}<small>${n}</small></button>`).join("")}</div>`;
  }

  // ---------- Inicio ----------
  function kpisHtml(rows) {
    const con28 = rows.filter((m) => m.r28 != null);
    const x = avg(con28.map((m) => m.r28));
    const ok = rows.filter((m) => m._e === "ok").length, no = rows.filter((m) => m._e === "no").length, wait = rows.filter((m) => m._e === "wait").length;
    const tot = rows.length || 1;
    const min = con28.length ? con28.reduce((a, b) => (b.r28 < a.r28 ? b : a)) : null;
    return `<div class="kpis">
      <div class="kpi"><span class="eyebrow">Muestras</span><span class="v">${rows.length}</span><span class="d">${con28.length} con ensayo a 28 días</span></div>
      <div class="kpi"><span class="eyebrow">Promedio general R28d</span><span class="v">${fmt(x)}<small>kg/cm²</small></span><span class="d">${x != null ? `${fmt(round2((x / state.obra.fc) * 100))} % del f'c de ${state.obra.fc}` : "Sin ensayos a 28 días"}</span></div>
      <div class="kpi"><span class="eyebrow">Cumplen 0,85 f'c</span><span class="v">${ok}<small>de ${rows.length}</small></span>
        <div class="split-bar" aria-hidden="true"><span class="sb-good" style="width:${(ok / tot) * 100}%"></span><span class="sb-crit" style="width:${(no / tot) * 100}%"></span><span class="sb-wait" style="width:${(wait / tot) * 100}%"></span></div>
        <span class="d">${no} no cumplen · ${wait} pendientes</span></div>
      <div class="kpi"><span class="eyebrow">Menor R28d</span><span class="v">${min ? fmt(min.r28) : "—"}${min ? "<small>kg/cm²</small>" : ""}</span><span class="d">${min ? `${esc(min.muestra)} · ${dmy(min.fecha)}` : "Sin ensayos a 28 días"}</span></div>
    </div>`;
  }

  function chartHtml(rows) {
    const data = rows.filter((m) => m.r28 != null).sort((a, b) => a.fecha.localeCompare(b.fecha) || natCmp(a.muestra, b.muestra));
    if (!data.length) return `<div class="empty"><b>Sin ensayos a 28 días</b>Cuando el laboratorio entregue resultados a 28 días aparecerán aquí.</div>`;
    const thr = state.obra.fc * 0.85;
    const H = 280, padL = 42, padR = 64, padT = 14, padB = 46;
    const minW = padL + padR + data.length * 13;
    const W = Math.max(chartW, minW);
    const maxV = Math.max(state.obra.fc * 1.1, ...data.map((d) => d.r28));
    const step = maxV > 300 ? 100 : 50; const top = Math.ceil(maxV / step) * step;
    const y = (v) => padT + (H - padT - padB) * (1 - v / top);
    const slot = (W - padL - padR) / data.length; const bw = Math.min(26, Math.max(10, slot - 8));
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="${v ? "grid-l" : "base-l"}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    let bars = "";
    data.forEach((d, i) => {
      const cx = padL + slot * i + slot / 2; const x0 = cx - bw / 2; const yt = y(d.r28); const h = y(0) - yt;
      const bad = d.r28 <= fcMuestra(d) * 0.85; const r = Math.min(4, bw / 2, h);
      bars += `<path class="${bad ? "g-crit" : "g-int"}" d="M${x0},${y(0)} V${yt + r} Q${x0},${yt} ${x0 + r},${yt} H${x0 + bw - r} Q${x0 + bw},${yt} ${x0 + bw},${yt + r} V${y(0)} Z" fill="${bad ? "var(--crit)" : "var(--int)"}"/>
        <text class="ax" x="${cx}" y="${H - padB + 14}" text-anchor="end" transform="rotate(-50 ${cx} ${H - padB + 14})">${esc(d.muestra)}</text>
        <rect class="hit" data-i="${i}" x="${cx - slot / 2}" y="${padT}" width="${slot}" height="${H - padT - padB}"/>`;
    });
    const lines = `<line class="lim" x1="${padL}" x2="${W - padR}" y1="${y(thr)}" y2="${y(thr)}"/><text class="lim-t" x="${W - padR + 6}" y="${y(thr) + 4}">${fmt(round2(thr))}</text>
      <line class="fc" x1="${padL}" x2="${W - padR}" y1="${y(state.obra.fc)}" y2="${y(state.obra.fc)}"/><text class="fc-t" x="${W - padR + 6}" y="${y(state.obra.fc) + 4}">f'c ${state.obra.fc}</text>`;
    chartData = data;
    return `<div class="chart-scroll"><div class="chart"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resistencia a 28 días de ${data.length} muestras frente a 0,85 f'c">${g}${lines}${bars}</svg></div></div>`;
  }
  let chartData = [], chartW = 640;

  function renderInicio(main) {

          ${pend.length ? `<div class="list">${pend.slice(0, 5).map((m) => `<div class="list-row"><span class="ck" style="border:2px solid var(--line-2)" aria-hidden="true"></span><div class="nm"><b>${esc(m.muestra)}</b><span>${dmy(m.fecha)} · ${esc(m.localizacion || "")}</span></div><div class="rt2"><span class="hint">R7d</span><b>${fmt(m.r7)}</b></div></div>`).join("")}</div>` : `<p class="hint" style="margin:0">No hay muestras esperando el ensayo a 28 días.</p>`}
        </section>

    const box = $("#chartBox");
    const w = box.clientWidth;
    if (w && Math.abs(w - chartW) > 4) { chartW = w; box.innerHTML = chartHtml(rows); }
  }

  // ---------- Cargar ----------
  function renderCargar(main) {
    const p = state.plan;
    let review = "";
    if (p && p.error) review = `<section class="card"><p class="err">${esc(p.error)}</p><div class="actions" style="margin-top:12px"><button class="btn" type="button" data-act="discard">Cerrar</button></div></section>`;
    else if (p) {
      const cnt = (t) => p.items.filter((i) => i.tipo === t).length;

          ${it.alertas.length ? `<ul class="alerts">${it.alertas.map((a) => `<li>${ICON.warn}<span>${esc(a)}</span></li>`).join("")}</ul>` : ""}</div></div>`;
