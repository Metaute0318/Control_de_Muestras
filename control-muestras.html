        <div class="card-hd"><div><h2 id="rTit">${p.manual ? "Revisión del registro manual" : "Revisión de " + esc(p.archivo)}</h2><p class="hint">${esc(p.fuentes.join(" · ") || "sin datos reconocidos")}</p></div></div>
        <div class="sumrow" style="margin-bottom:14px">
          <span class="pill big new">${plural(cnt("nueva"), "nueva", "nuevas")}</span>
          <span class="pill big good">${cnt("actualiza")} con resultados nuevos</span>
          <span class="pill big">${iguales.length} sin cambios</span>
          ${nDif ? `<span class="pill big crit">${plural(nDif, "valor distinto", "valores distintos")}</span>` : ""}
          ${nDif && state.canWrite ? `<button class="btn sm" type="button" data-act="difAll">${p.items.every((i) => i.difs.every((d) => d.reemplazar)) ? "Mantener los registrados" : "Reemplazar todos los distintos"}</button>` : ""}
          ${nAlert ? `<span class="pill big warn">${nAlert} con alertas</span>` : ""}
        </div>
        ${p.errores && p.errores.length ? `<div class="err" style="margin-bottom:14px">${p.errores.map(esc).join("<br>")}</div>` : ""}
        ${nada ? `<div class="note">Todas las muestras del archivo ya están en la planilla con los mismos valores.</div>` : `<div class="rlist">${lista}</div>`}
        ${iguales.length ? `<p class="hint" style="margin:12px 0 0">Sin cambios: ${iguales.map((i) => esc(i.rec.muestra)).join(", ")}</p>` : ""}
        <div class="actions" style="margin-top:16px">
          <button class="btn primary" type="button" data-act="apply" ${!state.canWrite ? "disabled" : ""}>${nada ? "Guardar detalle de probetas" : "Aplicar cambios"}</button>
          <button class="btn" type="button" data-act="discard">Descartar</button>
          <span class="hint">${state.canWrite ? "Los valores ya registrados no se tocan, salvo los que marques como Reemplazar." : "Tienes acceso de solo lectura."}</span>
        </div></section>`;
    }
    main.innerHTML = `<div class="stack">${review}
      <div class="dash">
      <section class="card s5" aria-labelledby="cTit">
        <div class="card-hd"><div><h2 id="cTit">Archivo del laboratorio</h2><p>Sube el Excel que descargas de SGS, los informes PDF de resultados (cuando aún no están en la base de datos) o el propio RT-037. Puedes elegir varios archivos a la vez. Nada se guarda hasta que revises los cambios.</p></div></div>
        <div class="drop" id="drop" role="button" tabindex="0" data-act="pick">${ICON.cargar}<b>Arrastra los archivos aquí</b><span>Excel (.xlsx, .xlsm, .csv) o PDF de SGS · o haz clic para elegirlos</span></div>
        <div class="rules">
          <div><span class="eyebrow">1 a 27 días</span><b>R7d</b><span class="hint">Nominal: 7 días</span></div>
          <div><span class="eyebrow">28 a 55 días</span><b>R28d</b><span class="hint">Nominal: 28 días. Define si cumple 0,85 f'c</span></div>
          <div><span class="eyebrow">56 días o más</span><b>R56d</b><span class="hint">Nominal: 56 días</span></div>
        </div>
        <p class="hint" style="margin:10px 0 0">Si una probeta se falla a una edad distinta de 7, 28 o 56 días, la revisión lo avisa y la planilla muestra la edad junto al resultado.</p>
      </section>
      ${manualHtml()}
      </div></div>`;
  }

  // ---------- Registro manual ----------
  function manualPrev() {
    const m = state.manual;
    const ens = m.probetas.map((p) => [num(p.edad), num(p.res)]).filter((e) => e[0] != null && e[1] != null && e[0] > 0);
    if (!ens.length) return `<span class="hint">Escribe la edad y la resistencia de cada probeta para ver los promedios.</span>`;
    return AGES.map(([b, lbl]) => {
      const v = ens.filter((e) => bucket(e[0]) === b).map((e) => e[1]);
      return v.length ? `<span>${LBL[b]} <b>${fmt(avg(v))}</b>${edadTag(edadesRaras(ens)[b])} <span class="hint">(${plural(v.length, "probeta", "probetas")})</span></span>` : "";
    }).join("");
  }
  function manualHtml() {
    const m = state.manual; const bad = new Set(m.bad || []);
    const vals = [...state.muestras.values()];
    const uniq = (f) => [...new Set(vals.map((x) => x[f]).filter(Boolean))].sort(natCmp);
    const dl = (id, list) => `<datalist id="${id}">${list.map((v) => `<option value="${esc(v)}"></option>`).join("")}</datalist>`;
    const fld = (f, label, extra = "", cls = "") => `<label class="fld${cls}">${label}<input class="inp${bad.has(f) ? " bad" : ""}" data-m="${f}" value="${esc(m[f])}" ${extra}></label>`;
    const rows = m.probetas.map((p, i) => `<tr>
      <td>${i + 1}</td>
      <td class="n"><input class="inp${bad.has("edad" + i) ? " bad" : ""}" type="number" min="1" step="1" inputmode="numeric" data-p="${i}|edad" value="${esc(p.edad)}" list="dlEdades" aria-label="Edad de la probeta ${i + 1} en días"></td>
      <td class="n"><input class="inp${bad.has("res" + i) ? " bad" : ""}" type="number" min="0" step="0.1" inputmode="decimal" data-p="${i}|res" value="${esc(p.res)}" placeholder="kg/cm²" aria-label="Resistencia de la probeta ${i + 1} en kg/cm²"></td>
      <td><input class="inp" type="date" data-p="${i}|fr" value="${esc(p.fr)}" aria-label="Fecha de rotura de la probeta ${i + 1}"></td>
      <td><button class="icon-btn" type="button" data-act="mDel" data-i="${i}" aria-label="Quitar probeta ${i + 1}" ${m.probetas.length < 2 ? "disabled" : ""}>✕</button></td></tr>`).join("");
    return `<section class="card s7" aria-labelledby="mTit">
      <div class="card-hd"><div><h2 id="mTit">Registro manual</h2><p>Para resultados que llegan por correo, en papel o en un PDF escaneado. Escribe cada probeta ensayada; la página promedia por edad y te muestra la revisión antes de guardar.</p></div></div>
      <div class="fgrid">
        ${fld("muestra", "Muestra Nº", 'list="dlMuestras" autocomplete="off" placeholder="M31"')}
        ${fld("fecha", "Fecha de muestreo", 'type="date"')}
        ${fld("codigo", "Código de mezcla", 'list="dlCodigos" autocomplete="off"')}
        ${fld("remision", "Remisión", 'list="dlRemisiones" autocomplete="off"')}
        ${fld("localizacion", "Localización", 'list="dlLoc" autocomplete="off" placeholder="Fachada piso 12"', " wide")}
      </div>
      ${dl("dlMuestras", uniq("muestra"))}${dl("dlCodigos", uniq("codigo"))}${dl("dlRemisiones", uniq("remision"))}${dl("dlLoc", uniq("localizacion"))}${dl("dlEdades", ["7", "28", "56"])}
      <div class="tbl-wrap ptable"><table><thead><tr><th>Nº</th><th class="n">Edad (días)</th><th class="n">Resistencia (kg/cm²)</th><th>Fecha de rotura</th><th><span class="sr">Quitar</span></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="actions" style="margin-top:10px"><button class="btn sm" type="button" data-act="mAdd">+ Agregar probeta</button><div class="mprev" id="mPrev">${manualPrev()}</div></div>
      ${m.error ? `<p class="err" id="mErr" style="margin-top:12px">${esc(m.error)}</p>` : ""}
      <div class="actions" style="margin-top:14px"><button class="btn primary" type="button" data-act="mReview" ${state.canWrite ? "" : "disabled"}>Revisar resultados</button><button class="btn" type="button" data-act="mClear">Limpiar</button>
        <span class="hint">Si dejas vacía la fecha de rotura se toma la fecha de muestreo más la edad.</span></div>
    </section>`;
  }
  // Al escribir un Nº que ya existe, se completan los datos de su registro más reciente.
  function manualAutofill() {
    const m = state.manual; const id = muestraId(m.muestra); if (!id) return false;
    const prev = [...state.muestras.values()].filter((x) => x.muestra === id).sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    if (!prev || m.localizacion) return false;
    Object.assign(m, { fecha: prev.fecha, codigo: prev.codigo || m.codigo, localizacion: prev.localizacion || "", remision: prev.remision || m.remision });
    const tiene = AGES.filter(([b]) => prev[b] != null).map(([b]) => b);
    const falta = AGES.find(([b]) => !tiene.includes(b));
    if (falta && m.probetas.every((p) => !p.res)) m.probetas.forEach((p) => (p.edad = falta[1].replace(" d", "")));
    return true;
  }
  function manualReview() {
    const m = state.manual; const bad = [];
    const id = muestraId(m.muestra);
    if (!id) bad.push("muestra");
    if (!isoDate(m.fecha)) bad.push("fecha");
    const ens = [];
    m.probetas.forEach((p, i) => {
      const e = num(p.edad), r = num(p.res);
      if (String(p.res).trim() === "") return;
      if (e == null || e <= 0 || e > 365) bad.push("edad" + i);
      if (r == null || r <= 0 || r > 2000) bad.push("res" + i);
      if (e > 0 && r > 0) ens.push([e, round2(r), isoDate(p.fr) || (isoDate(m.fecha) ? addDays(isoDate(m.fecha), e) : null)]);
    });
    m.bad = bad;
    if (bad.length || !ens.length) {
      m.error = !ens.length && !bad.some((b) => /^(edad|res)/.test(b)) ? "Escribe al menos una probeta con su edad y resistencia." : "Revisa los campos marcados en rojo: falta el Nº de muestra, la fecha o algún valor de probeta no es válido.";
      renderMain(); return;
    }
    m.error = "";
    const fecha = isoDate(m.fecha);
    const rec = { muestra: id, fecha, codigo: m.codigo.trim(), localizacion: m.localizacion.trim(), remision: m.remision.trim(), ensayos: ens, alertas: [] };
    for (const [b] of AGES) { const v = ens.filter((e) => bucket(e[0]) === b).map((e) => e[1]); rec[b] = avg(v); rec["n" + b.slice(1)] = v.length || null; }
    state.plan = planImport({ incoming: new Map([[docId(id, fecha), rec]]), fuentes: [`${plural(ens.length, "probeta", "probetas")} escritas a mano`], obraInfo: {}, archivo: MANUAL, filas: ens.length, manual: true });
    renderAll(); window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ---------- Planilla ----------
  function probetasHtml(m) {
    return AGES.map(([b, lbl]) => {
      const ens = (m.ensayos || []).filter((e) => bucket(e[0]) === b);
      const nota = m.notas && m.notas[b];
      if (!ens.length && m[b] == null) return "";
      return `<div class="grp"><b>${lbl}</b>${ens.length ? ens.map((e) => `<span class="p" title="Edad ${e[0]} días${e[2] ? " · rotura " + dmy(e[2]) : ""}">${fmt(e[1])}${e[0] !== EDAD_STD[b] ? edadTag([e[0]]) : ""}</span>`).join("") : `<span class="p">${fmt(m[b])}</span><span class="nt">Sin detalle de probetas (valor del formato).</span>`}
        ${nota ? `<span class="nt">${esc(nota)}</span>` : ""}</div>`;
    }).join("") || `<span class="hint">Sin ensayos todavía.</span>`;
  }
  function tablaHtml(rows) {
    if (!state.muestras.size) return `<div class="empty"><b>${state.mode === "loading" ? "Cargando planilla…" : "Aún no hay muestras"}</b>${state.mode === "loading" ? "" : "Carga el RT-037 o el archivo del laboratorio para empezar."}</div>`;
    if (!rows.length) return `<div class="empty"><b>Sin resultados</b>Ninguna muestra coincide con el filtro.</div>`;
    const cell = (v, thr, raras) => v == null ? `<td class="n empty-v">—</td>` : `<td class="n${v <= thr ? " below" : ""}">${fmt(v)}${edadTag(raras)}</td>`;
    const body = rows.map((m) => {
      const rr = edadesRaras(m.ensayos);
      const fcM = fcMuestra(m); const thr = round2(fcM * 0.85); const open = state.abierto === m.id;
      const fcFlag = fcDe(m.codigo) != null && fcDe(m.codigo) !== state.obra.fc;
      const [cls, txt] = ESTADO[m._e];
      let tr = `<tr class="row${open ? " open" : ""}" data-id="${esc(m.id)}" tabindex="0" aria-expanded="${open}">
        <td class="m">${esc(m.muestra)}</td><td>${esc(m.codigo || "—")}${fcFlag ? `<span class="flag" title="f'c distinto al de la obra">${ICON.warn}</span>` : ""}</td>
        <td class="loc">${esc(m.localizacion || "—")}</td><td class="num">${dmy(m.fecha)}</td>
        ${cell(m.r7, thr, rr.r7)}${cell(m.r28, thr, rr.r28)}<td class="n">${fmt(fcM)}</td><td class="n">${fmt(thr)}</td>${cell(m.r56, thr, rr.r56)}
        <td><span class="pill ${cls}">${txt}</span></td><td class="loc">${esc(m.obs || "")}</td></tr>`;
      if (open) {
        const conf = state.confirmDel === m.id;
        tr += `<tr class="detail"><td colspan="11"><div class="det">
          <div><span class="eyebrow">Probetas ensayadas (kg/cm²)</span><div class="probetas">${probetasHtml(m)}</div></div>
          <div><dl class="kv"><dt>Remisión</dt><dd>${esc(m.remision || "—")}</dd><dt>Actualizado</dt><dd>${m.actualizado ? new Date(m.actualizado).toLocaleString("es-CO") : "—"}</dd></dl>
            <label class="eyebrow" for="obs-${esc(m.id)}">Observaciones (acciones tomadas)</label>
            <textarea id="obs-${esc(m.id)}" data-obs="${esc(m.id)}" ${state.canWrite ? "" : "disabled"}>${esc(m.obs || "")}</textarea>
            ${state.canWrite ? `<div class="actions"><button class="btn sm primary" type="button" data-save="${esc(m.id)}">Guardar observación</button>
              ${conf ? `<span class="hint">¿Eliminar ${esc(m.muestra)} del ${dmy(m.fecha)}?</span><button class="btn sm danger" type="button" data-del="${esc(m.id)}">Sí, eliminar</button><button class="btn sm" type="button" data-nodel>Cancelar</button>`
                : `<button class="btn sm danger" type="button" data-askdel="${esc(m.id)}">Eliminar muestra</button>`}</div>` : ""}
          </div></div></td></tr>`;
      }
      return tr;
    }).join("");
    return `<div class="tbl-wrap planilla"><table><thead><tr><th>Muestra Nº</th><th>Código mezcla</th><th>Localización</th><th>Fecha de fundida</th><th class="n">R 7d</th><th class="n">R 28d</th><th class="n">f'c</th><th class="n">0,85 f'c</th><th class="n">R 56d</th><th>¿Cumple 0,85 f'c?</th><th>Observaciones</th></tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function renderPlanilla(main) {
    const segE = [["todos", "Todos"], ["ok", "Cumple"], ["no", "No cumple"], ["wait", "Pendiente"], ["edad", "Edad distinta"]];
    const all = [...state.muestras.values()].filter((m) => state.filtro.serie === "todas" || serieDe(m.muestra) === state.filtro.serie);
    const cnt = (e) => e === "todos" ? all.length : e === "edad" ? all.filter((m) => Object.keys(edadesRaras(m.ensayos)).length).length : all.filter((m) => estado(m) === e).length;
    main.innerHTML = `<section class="card">
      <div class="filters">${segSerie()}
        <div class="seg" role="group" aria-label="Estado">${segE.map(([v, l]) => `<button type="button" data-estado="${v}" aria-pressed="${state.filtro.estado === v}">${l}<small>${cnt(v)}</small></button>`).join("")}</div>
        <input class="search" id="fQ" type="search" placeholder="Buscar muestra, localización o remisión" aria-label="Buscar muestra, localización o remisión" value="${esc(state.filtro.q)}">
        <span class="spacer"></span>
        ${downloads ? `<button class="btn" type="button" data-act="export">${ICON.dl} Descargar Excel</button>` : ""}
      </div>
      <div id="tablaBox">${tablaHtml(filtradas())}</div></section>`;
  }

  // ---------- Historial ----------
  function renderHistorial(main) {
    const h = state.historial;
    main.innerHTML = `<section class="card"><div class="card-hd"><h2>Cargas de archivos<small>${h.length}</small></h2></div>
      ${h.length ? `<div class="list">${h.map((x) => `<div class="hist-row"><span class="when">${new Date(x.ts).toLocaleString("es-CO", { dateStyle: "medium", timeStyle: "short" })}</span>
        <div class="what"><b>${esc(x.archivo)}</b><div>${x.filas || 0} ensayos leídos · ${plural((x.nuevas || []).length, "nueva", "nuevas")} · ${plural((x.actualizadas || []).length, "actualizada", "actualizadas")} · ${x.sinCambios || 0} sin cambios</div>
        ${(x.nuevas || []).length ? `<div class="hint">Nuevas: ${esc(x.nuevas.join(", "))}</div>` : ""}${(x.actualizadas || []).length ? `<div class="hint">Actualizadas: ${esc(x.actualizadas.join(", "))}</div>` : ""}</div></div>`).join("")}</div>`
        : `<div class="empty"><b>Sin cargas todavía</b>Cada archivo que apliques desde Cargar resultados queda registrado aquí.</div>`}
    </section>`;
  }

  function renderMain() {
    hideTip();
    const main = $("#main");
    ({ inicio: renderInicio, cargar: renderCargar, planilla: renderPlanilla, historial: renderHistorial })[state.tab](main);
  }
  function renderAll() { renderChrome(); renderMain(); }
  function goTab(t) { state.tab = t; ls.set("tab", t); renderAll(); window.scrollTo({ top: 0 }); }

  // ---------- exportar ----------
  async function exportar() {
    if (!downloads) return;
    const rows = [...state.muestras.values()].sort((a, b) => a.fecha.localeCompare(b.fecha) || natCmp(a.muestra, b.muestra));
    const fc = state.obra.fc;
    const aoa = [["RT-037 CONTROL DE RESISTENCIAS DE MORTERO"], ["OBRA:", state.obra.obra || "", "", "f'c =", fc, "(kg/cm2)"], [],
      ["Muestra Nº", "Código Mezcla", "Localizacion", "Fecha de fundida", "R 7d (kg/cm2)", "R 28d (kg/cm2)", "f'c  (kg/cm2)", "0,85f´c", "R 56d (kg/cm2)", "Cumple 0,85f`c?", "Observaciones (Acciones tomadas)", "Remisión", "Edad de falla distinta"]];
    for (const m of rows) {
      const f = fcMuestra(m); const e = estado(m);
      const [y, mo, d] = m.fecha.split("-").map(Number);
      aoa.push([m.muestra, m.codigo || "", m.localizacion || "", new Date(Date.UTC(y, mo - 1, d)), m.r7 ?? "", m.r28 ?? "", f, round2(f * 0.85), m.r56 ?? "", e === "ok" ? "Cumple" : e === "no" ? "NO Cumple" : "", m.obs || "", m.remision || "", Object.entries(edadesRaras(m.ensayos)).map(([b, a]) => `${LBL[b]} a ${diasTxt(a)}`).join("; ")]);
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true, dateNF: "dd/mm/yyyy" });
    ws["!cols"] = [10, 14, 44, 14, 12, 12, 10, 10, 12, 14, 40, 16, 22].map((w) => ({ wch: w }));
    const ens = [["Muestra Nº", "Fecha de muestreo", "Edad (días)", "Grupo", "Resistencia (kg/cm2)", "Fecha de rotura", "Remisión", "Localización"]];
    for (const m of rows) for (const e of m.ensayos || []) ens.push([m.muestra, dmy(m.fecha), e[0], LBL[bucket(e[0])], e[1], e[2] ? dmy(e[2]) : "", m.remision || "", m.localizacion || ""]);
    const ws2 = XLSX.utils.aoa_to_sheet(ens); ws2["!cols"] = [10, 16, 10, 8, 18, 14, 16, 44].map((w) => ({ wch: w }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "CONTROL");
    XLSX.utils.book_append_sheet(wb, ws2, "PROBETAS");
    const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    try {
      await downloads.save({ filename: `RT-037_control_${ymd(new Date())}.xlsx`, data: new Blob([out]) });
      toast("Excel descargado.");
    } catch (e) {
      if (e && e.code === "declined") return;
      toast(e && e.code === "rate_limited" ? "Ya hay una descarga pendiente de confirmar." : "La descarga no está disponible en esta vista.");
    }
  }

  // ---------- eventos ----------
  async function handleFiles(list) {
    const files = [...(list || [])]; if (!files.length) return;
    const total = { incoming: new Map(), fuentes: [], obraInfo: {}, archivo: files.length === 1 ? files[0].name : plural(files.length, "archivo", "archivos"), filas: 0 };
    const errores = [];
    state.plan = null; goTab("cargar"); toast(files.length > 1 ? `Leyendo ${files.length} archivos…` : `Leyendo ${files[0].name}…`);
    for (const f of files) {
      try {
        if (!/\.pdf$/i.test(f.name) && typeof XLSX === "undefined") throw { code: "sin_xlsx" };
        const r = await readFile(f);
        if (!r.incoming.size) { errores.push(/\.pdf$/i.test(f.name) ? `"${f.name}" no tiene el formato del informe de resultados de SGS (Identificación de Muestra, Fecha de Fundida y Resistencia a la Compresión en kgf/cm²).` : `"${f.name}" no tiene resultados: debe tener las columnas label, fechaMuestreo, edad y Resistencia Kg/Cm2 (formato del laboratorio) o la hoja CONTROL del RT-037.`); continue; }
        for (const rec of r.incoming.values()) combine(total.incoming, rec);
        total.fuentes.push(...r.fuentes); total.filas += r.filas; Object.entries(r.obraInfo).forEach(([k, v]) => { if (!total.obraInfo[k]) total.obraInfo[k] = v; });
      } catch (e) {
        errores.push(e && e.code === "pdf_sin_texto" ? `"${f.name}" es un PDF escaneado, sin texto que se pueda leer. Usa el registro manual para esa muestra.`
          : e && e.code === "sin_xlsx" ? "No se pudo cargar el lector de Excel. Recarga la página e inténtalo de nuevo."
          : /\.pdf$/i.test(f.name) && !window.pdfjsLib ? "No se pudo cargar el lector de PDF. Revisa tu conexión y vuelve a intentarlo."
          : `No se pudo leer "${f.name}". Verifica que sea un .xlsx, .xlsm, .csv o .pdf y que no esté protegido con contraseña.`);
      }
    }
    state.plan = total.incoming.size ? { ...planImport(total), errores } : { error: errores.join(" "), items: [] };
    toast(""); $("#toast").hidden = true; renderAll();
  }

  $("#fileInput").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
  const main = $("#main");
  main.addEventListener("dragover", (e) => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
  main.addEventListener("dragleave", (e) => { const d = e.target.closest("#drop"); if (d) d.classList.remove("over"); });
  main.addEventListener("drop", (e) => { const d = e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.remove("over"); handleFiles(e.dataTransfer.files); } });
  main.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop") { e.preventDefault(); $("#fileInput").click(); return; }
    const row = e.target.closest("tr.row"); if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggleRow(row.dataset.id); }
  });
  main.addEventListener("change", (e) => {
    if (e.target.dataset.m === "muestra") { if (manualAutofill()) { renderMain(); const n = main.querySelector('[data-p="0|res"]'); if (n) n.focus(); } return; }
    const c = e.target.closest("[data-dif]"); if (!c || !state.plan) return;
    const [k, j] = c.dataset.dif.split("|"); const it = state.plan.items.find((i) => i.k === k); if (it) it.difs[+j].reemplazar = c.checked;
    const bulk = main.querySelector('[data-act="difAll"]'); if (bulk) bulk.textContent = state.plan.items.every((i) => i.difs.every((d) => d.reemplazar)) ? "Mantener los registrados" : "Reemplazar todos los distintos";
  });
  main.addEventListener("input", (e) => {
    const t = e.target;
    if ((t.dataset.m || t.dataset.p) && state.manual.error) { state.manual.error = ""; const er = $("#mErr"); if (er) er.remove(); }
    if (t.dataset.m) { state.manual[t.dataset.m] = t.value; t.classList.remove("bad"); return; }
    if (t.dataset.p) { const [i, f] = t.dataset.p.split("|"); state.manual.probetas[+i][f] = t.value; t.classList.remove("bad"); const pv = $("#mPrev"); if (pv) pv.innerHTML = manualPrev(); return; }
    if (t.id !== "fQ") return;
    state.filtro.q = t.value; $("#tablaBox").innerHTML = tablaHtml(filtradas());
  });
  main.addEventListener("mousemove", (e) => {
    const h = e.target.closest && e.target.closest(".chart .hit"); if (!h) { hideTip(); return; }
    const d = chartData[+h.dataset.i]; if (!d) return;
    const fcM = fcMuestra(d); const [, txt] = ESTADO[estado(d)];
    showTip(`<b>${esc(d.muestra)}</b> · ${dmy(d.fecha)}<div class="row"><span>R28d</span><b>${fmt(d.r28)} kg/cm²</b></div><div class="row"><span>% de f'c</span><b>${fmt(round2((d.r28 / fcM) * 100))} %</b></div><div class="row"><span>${txt}</span><b>límite ${fmt(round2(fcM * 0.85))}</b></div>${edadesRaras(d.ensayos).r28 ? `<div class="row"><span>Fallada a</span><b>${diasTxt(edadesRaras(d.ensayos).r28)}</b></div>` : ""}${d.localizacion ? `<div>${esc(d.localizacion)}</div>` : ""}`, e);
  });
  main.addEventListener("mouseleave", hideTip);

  function toggleRow(id) { state.abierto = state.abierto === id ? null : id; state.confirmDel = null; $("#tablaBox").innerHTML = tablaHtml(filtradas()); }

  document.addEventListener("click", async (e) => {
    const t = e.target.closest("[data-tab]"); if (t) { goTab(t.dataset.tab); return; }
    if (e.target.closest("[data-act-theme]")) { aplicarTema(temaActual() === "oscuro" ? "claro" : "oscuro"); return; }
    const go = e.target.closest("[data-go]"); if (go) { if (go.dataset.estadoGo) state.filtro.estado = go.dataset.estadoGo; goTab(go.dataset.go); return; }
    const s = e.target.closest("[data-serie]"); if (s) { state.filtro.serie = s.dataset.serie; renderMain(); return; }
    const es = e.target.closest("[data-estado]"); if (es) { state.filtro.estado = es.dataset.estado; renderMain(); return; }
    const a = e.target.closest("[data-act]");
    if (a) {
      const act = a.dataset.act;
      if (act === "pick") $("#fileInput").click();
      if (act === "apply") applyPlan(a);
      if (act === "discard") { state.plan = null; renderAll(); }
      if (act === "export") exportar();
      if (act === "difAll" && state.plan) { const all = state.plan.items.every((i) => i.difs.every((d) => d.reemplazar)); state.plan.items.forEach((i) => i.difs.forEach((d) => (d.reemplazar = !all))); renderMain(); }
      if (act === "mAdd") { const ps = state.manual.probetas; ps.push(probetaVacia(ps.length ? ps[ps.length - 1].edad : "7")); renderMain(); const n = main.querySelector(`[data-p="${ps.length - 1}|res"]`); if (n) n.focus(); }
      if (act === "mDel") { state.manual.probetas.splice(+a.dataset.i, 1); state.manual.bad = []; renderMain(); }
      if (act === "mReview") manualReview();
      if (act === "mClear") { state.manual = nuevoManual(state.manual); renderMain(); }
      return;
    }
    const sv = e.target.closest("[data-save]");
    if (sv) {
      const id = sv.dataset.save; const m = state.muestras.get(id); const ta = main.querySelector(`[data-obs="${CSS.escape(id)}"]`);
      if (m && ta) { try { await putMuestra(id, { ...m, obs: ta.value.trim(), actualizado: new Date().toISOString() }); toast("Observación guardada."); $("#tablaBox").innerHTML = tablaHtml(filtradas()); } catch (er) { toast("No se pudo guardar la observación."); } }
      return;
    }
    const ask = e.target.closest("[data-askdel]"); if (ask) { state.confirmDel = ask.dataset.askdel; $("#tablaBox").innerHTML = tablaHtml(filtradas()); return; }
    if (e.target.closest("[data-nodel]")) { state.confirmDel = null; $("#tablaBox").innerHTML = tablaHtml(filtradas()); return; }
    const del = e.target.closest("[data-del]");
    if (del) { try { await delMuestra(del.dataset.del); state.abierto = null; state.confirmDel = null; renderMain(); toast("Muestra eliminada."); } catch (er) { toast("No se pudo eliminar la muestra."); } return; }
    const row = e.target.closest("tr.row"); if (row) toggleRow(row.dataset.id);
  });

  let fcT;
  $("#fcInput").addEventListener("input", (e) => {
    const v = num(e.target.value); if (!v || v <= 0) return;
    state.obra.fc = v; clearTimeout(fcT);
    renderMain();
    fcT = setTimeout(() => { putObra().catch(() => toast("No se pudo guardar el f'c.")); }, 700);
  });
  let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (state.tab === "inicio") renderMain(); }, 150); });
  try { window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", pintarTemaBtn); } catch (e) { /* navegador antiguo */ }

  const t0 = ls.get("tema"); aplicarTema(t0 === "claro" || t0 === "oscuro" ? t0 : "");
  init();
})();
</script>
